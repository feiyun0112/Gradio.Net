# Three stages, so that a failure says which kind of failure it is:
#   build  - does it compile, on all three target frameworks, with no warnings?
#   test   - does the suite pass?
#   pack   - does it produce a package with the version the single version source implies?
#
# Publishing happens only for a version tag, which is why tags are listed as a trigger:
# without them the publish step below could never run. The pack stage must not push a
# package that has not been released deliberately, and the package version is derived
# from eng/Versions.props.

name: main

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - '**/*.gif'
      - '**/*.png'
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Gradio.Net.sln
      - name: Build (net8.0, net9.0, net10.0; warnings are errors)
        run: dotnet build Gradio.Net.sln --configuration Release --no-restore

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/Gradio.Net.Tests/Gradio.Net.Tests.csproj --configuration Release

  pack:
    name: pack
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: dotnet pack src/Gradio.Net/Gradio.Net.csproj --configuration Release --output out
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: out/*
      - name: Publish to nuget.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet nuget push "out/*.nupkg" --skip-duplicate
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ secrets.NUGET_KEY }}
